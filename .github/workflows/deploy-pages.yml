name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded zip
        run: |
          rm -rf site
          mkdir -p site
          z=$(ls -1 *.zip | head -1)
          echo "unpacking $z"
          unzip -q "$z" -d site
          touch site/.nojekyll
          test -f site/index.html || { echo "index.html missing at zip root"; exit 1; }

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
